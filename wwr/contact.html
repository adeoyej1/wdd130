<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Learn about our white water rafting company, our mission, history, and exciting rafting adventures.">

    <meta name="author" content="John Adeoye">

    <title>Contact Us | White Water Rafting</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="White Water Rafting Logo">

        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>

        <section class="company-info">
            <h2> Rafting Company</h2>
            <p>Cluster 3 River Park Estate, 13 Peter Odili Street</p>
            <p>Abuja, Nigeria</p>
            <p>+234 70 606 026 88</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-content">

            <div class="map">
                <h2>Find Us</h2>

                <iframe src="https://www.google.com/maps/embed?pb=..." allowfullscreen=""
                  loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

            <div class="contact-form">
                <h2>Send Us a Message</h2>

                <form action="#" method="post">

                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>

                    <fieldset>
                        <legend>Purpose of Message</legend>

                        <input type="radio" id="general" name="purpose" value="general" required>
                        <label for="general">General Inquiry</label>

                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>

                        <input type="radio" id="website" name="purpose" value="website">
                        <label for="website">Website Suggestion</label>
                    </fieldset>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6"></textarea>

                    <input type="checkbox" id="newsletter" name="newsletter">

                    <label for="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Send Message</button>

                </form>
            </div>

        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <div class="employee-gallery">
                <figure>
                    <img src="images/river-guide-john.jpg" alt="River Guide John">
                    <figcaption>John – Senior River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/safety-instructor-sarah.jpg" alt="Safety Instructor Sarah">
                    <figcaption>Sarah – Safety Instructor</figcaption>
                </figure>

                <figure>
                    <img src="images/tour-manager-david.jpg" alt="Tour Manager David">
                    <figcaption>David – Tour Manager</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form">


        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | John Adeoye</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
